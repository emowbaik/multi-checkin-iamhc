name: iamhc Daily Checkin

on:
  schedule:
    # 23:00 UTC = 07:00 CST (Asia/Shanghai) — primary slot
    - cron: '0 23 * * *'
    # Backup slot 00:20 UTC: GitHub drops scheduled ticks under load, and the
    # site answers "already checked in" for a second run, so it is harmless.
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  actions: write    # prune old runs
  contents: write   # monthly heartbeat commit (keeps schedules alive)

concurrency:
  group: iamhc-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify secrets are present
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          if [ -z "$ACCOUNTS" ] && [ -z "$EMAIL" ]; then
            echo "::error::Neither ACCOUNTS nor EMAIL is set — nothing to check in."
            exit 1
          fi
          echo "credentials: present"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run checkin
        env:
          # Multi-account: one email:password per line
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          # Single-account fallback (ACCOUNTS wins when set)
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          # Telegram report (optional)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py

      # GitHub disables every scheduled workflow in a repository after 60 days
      # without repository activity — that is what killed this job on
      # 2026-09-14 (last push 2026-07-15). A monthly commit from the scheduled
      # run itself keeps the repo active with no external scheduler.
      - name: Monthly activity heartbeat
        if: github.event_name == 'schedule' && github.event.schedule == '0 23 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "not the 1st — skipping heartbeat"
            exit 0
          fi
          mkdir -p .github
          printf 'last scheduled run: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "chore: monthly activity heartbeat" || exit 0
          git push

      - name: Prune old runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "${{ github.workflow }}" --limit 50 \
            --json databaseId,status \
            --jq '.[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            [ -z "$id" ] && continue
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh run delete "$id" >/dev/null 2>&1 && echo "deleted run $id" || true
          done
          echo "cleanup done"
